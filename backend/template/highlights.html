{% if total_summary %}
<section style="margin:8px 0 20px;padding:24px;border:1px solid #dce6f2;border-radius:12px;background:#f4f7fc">
<h2 style="margin:0 0 14px;color:#294d7b;font-size:16px;font-weight:700;letter-spacing:-.3px">이번 호 핵심 요약</h2>
<ul style="list-style:none;margin:0;padding:0">
{% for line in total_summary.splitlines() if line.strip() %}
<li style="margin:0;{% if not loop.first %}border-top:1px solid #dfe7f1;{% endif %}padding:13px 0">
<table role="presentation" style="width:100%;border-collapse:collapse"><tr>
<td style="width:22px;vertical-align:top;padding-top:9px"><span class="highlight-dot" aria-hidden="true" style="display:block;width:7px;height:7px;border-radius:50%;background:#527eaf"></span></td>
<td style="color:#283e59;font-size:15px;font-weight:600;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere">{{ line.strip().removeprefix('- ').strip() }}</td>
</tr></table>
</li>
{% endfor %}
</ul></section>
{% endif %}
